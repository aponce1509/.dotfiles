"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 1000
palette = "catppuccin_mocha"

# Icons are \u escapes so the file stays readable without a Nerd Font editor.
# ~/dotfiles  main !2  󰏗 v0.4  py 3.14  rs 1.99  3s
# ❯
format = """
$directory$git_branch$git_state$git_status$package\
$python$rust$nodejs$golang$lua$cmd_duration$status
$character"""

[character]
success_symbol = "[❯](bold mauve)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[directory]
style = "bold blue"
truncation_length = 2
truncate_to_repo = true
read_only = " \U000f033e"
read_only_style = "red"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = "\ue0a0 "
style = "mauve"
format = "[on](overlay1) [$symbol$branch(:$remote_branch)]($style) "

[git_state]
style = "bold peach"
format = "[\\($state( $progress_current/$progress_total)\\)]($style) "

[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "=$count "
ahead = "\u21e1$count "
behind = "\u21e3$count "
diverged = "\u21d5\u21e1$ahead_count\u21e3$behind_count "
untracked = "?$count "
stashed = "\u2261$count "
modified = "!$count "
staged = "+$count "
renamed = "\u00bb$count "
deleted = "\u2718$count "

[package]
symbol = "\U000f03d7 "
style = "peach"
format = "[is](overlay1) [$symbol$version]($style) "

[python]
symbol = "\ue73c "
style = "yellow"
pyenv_version_name = false
python_binary = ["./venv/bin/python", "./.venv/bin/python", "python3", "python"]
detect_extensions = ["py"]
format = "[via](overlay1) [$symbol$version]($style)([ \\($virtualenv\\)](green)) "
version_format = "${major}.${minor}"

[rust]
symbol = "\ue7a8 "
style = "peach"
format = "[via](overlay1) [$symbol$version]($style) "
version_format = "${major}.${minor}"

[nodejs]
symbol = "\ue718 "
style = "green"
format = "[via](overlay1) [$symbol$version]($style) "
version_format = "v${major}"

[golang]
symbol = "\ue627 "
style = "sapphire"
format = "[via](overlay1) [$symbol$version]($style) "
version_format = "v${major}.${minor}"

[lua]
symbol = "\ue620 "
style = "blue"
format = "[via](overlay1) [$symbol$version]($style) "
version_format = "v${major}.${minor}"

[cmd_duration]
min_time = 2000
style = "overlay1"
format = "[\U000f051b $duration]($style) "

[status]
disabled = false
symbol = "\u2718 "
style = "red"
format = "[$symbol$status]($style) "

[docker_context]
disabled = true

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
